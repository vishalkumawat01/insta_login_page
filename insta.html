<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Instagram login page">
  <title>Instagram Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title" class="brand">Instagram</h1>

      <form class="login-form" action="#" method="post">
        <label class="sr-only" for="username">Phone number, username, or email</label>
        <input id="username" name="username" type="text" placeholder="Phone number, username, or email" autocomplete="username" required>

        <label class="sr-only" for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>

        <button type="submit">Log in</button>
      </form>

      <div class="divider" aria-hidden="true">
        <span></span>
        <strong>OR</strong>
        <span></span>
      </div>

      <a class="facebook-login" href="C:\Users\M.M\login">Log in with Facebook</a>
      <a class="forgot-password" href="#">Forgot password?</a>
    </section>

    <section class="signup-card" aria-label="Create an account">
      <p>Don't have an account? <a href="#">Sign up</a></p>
    </section>

    <p class="app-label">Get the app.</p>
    <div class="app-links" aria-label="Download the app">
      <a href="#" aria-label="Download on the App Store">App Store</a>
      <a href="#" aria-label="Get it on Google Play">Google Play</a>
    </div>
  </main>

  <footer>
    <p>© 2026 Instagram</p>
  </footer>
</body>
</html>
